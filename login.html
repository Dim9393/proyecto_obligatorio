<!doctype html>
<html lang="es">
	<head>
		<title>Mundo Periféricos - Login</title>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="main-container">
			<a class="btn btn-secondary" href="guia_uso.html">Ayuda</a>

			<div class="container form-container">
				<center><h2>¡Bienvenidos a Mundo Periféricos!</h2></center>

				<div>
					<form id="form-login">
						<div class="form-group">
							<label for="correo">Correo Electronico</label>
							<input
								type="email"
								id="correo"
								maxlength="60"
								placeholder="Tu correo"
								required />
						</div>

						<div class="form-group">
							<label for="contrasenia">Contraseña</label>
							<input
								type="password"
								id="contrasenia"
								placeholder="Tu contraseña"
								required />
						</div>

						<br />

						<center>
							<button class="btn btn-primary" type="submit">Entrar</button
							><br />
							<a class="btn btn-secondary" href="index.html"
								>Aún no tengo cuenta</a
							>
						</center>
					</form>
				</div>
			</div>
		</div>

		<script src="scripts/base/storage.js"></script>
		<script src="scripts/base/autenticacion.js"></script>
		<script src="scripts/acceso/login.js"></script>
	</body>
</html>
